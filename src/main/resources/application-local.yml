spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mogu}
    username: ${DB_USERNAME:mogu}
    password: ${DB_PASSWORD:mogu}

mogu:
  auth:
    di:
      ephemeral-pepper-allowed: true
    mock-identity:
      secret: ${AUTH_MOCK_IDENTITY_SECRET:}
    registration-jwt:
      ephemeral-key-allowed: true
    jwt:
      ephemeral-key-allowed: true
    nonce:
      ephemeral-secret-allowed: true
