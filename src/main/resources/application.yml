spring:
  application:
    name: mogu-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

mogu:
  auth:
    rate-limit:
      query-timeout: 200ms
      cleanup-interval: PT10M
      rules:
        login-requests:
          limit: 50
          window: 1m
        login-failures:
          limit: 100
          window: 1d
          refill-interval: 15m
        nonce-requests:
          limit: 50
          window: 1m
        refresh-requests:
          limit: 4
          window: 1s
        refresh-failures:
          limit: 100
          window: 1d
          refill-interval: 15m
        logout-requests:
          limit: 4
          window: 1s
        identity-requests:
          limit: 4
          window: 1s
        identity-failures:
          limit: 10
          window: 1d
    pii:
      encryption-keys: ${AUTH_PII_ENCRYPTION_KEYS:}
      active-key-version: ${AUTH_PII_ACTIVE_KEY_VERSION:1}
      ephemeral-key-allowed: false
    di:
      pepper: ${AUTH_DI_PEPPER:}
      ephemeral-pepper-allowed: false
    identity:
      max-age: 10m
    jwt:
      issuer: mogu
      audience: mogu-api
      access-token-ttl: 15m
      clock-skew: 60s
      ephemeral-key-allowed: false
      signing-key:
        key-id: ${JWT_SIGNING_KEY_ID:}
        private-key-pem: ${JWT_SIGNING_PRIVATE_KEY:}
        public-key-pem: ${JWT_SIGNING_PUBLIC_KEY:}
    refresh-token:
      ttl: 30d
    registration-jwt:
      issuer: mogu
      audience: mogu-registration
      ttl: 10m
      clock-skew: 60s
      ephemeral-key-allowed: false
      signing-key:
        key-id: ${REGISTRATION_SIGNING_KEY_ID:}
        private-key-pem: ${REGISTRATION_SIGNING_PRIVATE_KEY:}
        public-key-pem: ${REGISTRATION_SIGNING_PUBLIC_KEY:}
    social:
      jwks-refresh-min-interval: 30s
      kakao:
        issuers: [https://kauth.kakao.com]
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        audiences: ${KAKAO_NATIVE_APP_KEY:}
      google:
        issuers: [https://accounts.google.com, accounts.google.com]
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        audiences: ${GOOGLE_CLIENT_IDS:}
    nonce:
      secret: ${AUTH_NONCE_SECRET:}
      ttl: 5m
      ephemeral-secret-allowed: false

springdoc:
  paths-to-match: /api/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  override-with-generic-response: false
